<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Account Vault</title>
<meta name="theme-color" content="#0e1116">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{ink:'#0e1116',panel:'#171c24',line:'#262d38',amber:'#f5b942'}}}}</script>
<style>
body{background:#0e1116;color:#e6e9ef;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top);-webkit-tap-highlight-color:transparent}
.in{background:#0e1116;border:1px solid #262d38;border-radius:12px;padding:12px 14px;width:100%;font-size:16px;color:#e6e9ef}
.in:focus{outline:2px solid #f5b942;outline-offset:0}
.btn{min-height:44px;min-width:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:14px;padding:0 14px;background:#1f2631;border:1px solid #262d38}
.btn:active{transform:scale(.96)}
.sw{width:52px;height:30px;border-radius:15px;background:#3b4350;position:relative;flex:none;transition:.15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:#16a34a}.sw.on::after{left:25px}
.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
input[type=date]{color-scheme:dark}
</style>
</head>
<body class="min-h-screen pb-32">
<header class="sticky top-0 z-20 bg-ink/95 backdrop-blur border-b border-line px-4 pt-3 pb-3" style="top:0">
  <div class="flex items-center justify-between mb-3">
    <h1 class="text-xl font-bold tracking-tight">Account Vault</h1>
    <div class="flex gap-2">
      <button id="checkAll" class="btn !bg-amber !text-black !border-amber">⟳ Check All</button>
      <button id="menuBtn" class="btn" aria-label="Backup menu">⋮</button>
    </div>
  </div>
  <div class="grid grid-cols-3 gap-2 mb-3 text-center">
    <div class="bg-panel border border-line rounded-xl py-2"><div id="sTotal" class="text-2xl font-bold">0</div><div class="text-xs text-slate-400">Total</div></div>
    <div class="bg-panel border border-line rounded-xl py-2"><div id="sLive" class="text-2xl font-bold text-green-400">0</div><div class="text-xs text-slate-400">Live</div></div>
    <div class="bg-panel border border-line rounded-xl py-2"><div id="sDead" class="text-2xl font-bold text-red-400">0</div><div class="text-xs text-slate-400">Need replacing</div></div>
  </div>
  <input id="q" class="in mb-3" type="search" placeholder="Search name, email or buyer">
  <div id="tabs" class="flex gap-2 overflow-x-auto no-scrollbar"></div>
  <div id="prog" class="hidden mt-2 text-xs text-amber"></div>
</header>

<main id="list" class="px-4 pt-4 space-y-3"></main>

<button id="fab" class="fixed right-4 z-30 bg-amber text-black font-bold rounded-full shadow-lg px-5 h-14 text-base" style="bottom:calc(env(safe-area-inset-bottom) + 16px)">+ Add Account</button>
<div id="toast" class="fixed left-1/2 -translate-x-1/2 z-50 bg-slate-100 text-black text-sm font-medium px-4 py-2 rounded-full hidden" style="bottom:90px"></div>
<div id="modal" class="fixed inset-0 z-40 bg-black/70 hidden items-end"></div>
<input id="file" type="file" accept="application/json,.json" class="hidden">

<script>
const KEY='accountVault.v1';
let shown=[],accounts=[],filter='all',query='',checking=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load=()=>{try{accounts=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){accounts=[]}};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(accounts))}catch(e){toast('Storage full or blocked')}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hidden'),2200)}
function age(d){if(!d)return null;const [y,m,da]=d.split('-').map(Number);const a=new Date(y,m-1,da),n=new Date();n.setHours(0,0,0,0);return Math.max(0,Math.round((n-a)/864e5))}
const matured=a=>(age(a.created)??-1)>=14;
async function copy(t,label){try{await navigator.clipboard.writeText(t)}catch(e){const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove()}toast(label+' copied')}

const TABS=[['all','All'],['live','Live Only'],['dead','Dead Only'],['mat','Matured (14+)']];
function render(){
  const L=accounts.filter(a=>a.status==='live').length,D=accounts.filter(a=>a.status==='dead').length;
  $('#sTotal').textContent=accounts.length;$('#sLive').textContent=L;$('#sDead').textContent=D;
  $('#tabs').innerHTML='<button data-tab="review" class="btn !min-h-[40px] whitespace-nowrap !border-amber text-amber">▶ Review</button>'+TABS.map(([k,n])=>`<button data-tab="${k}" class="btn !min-h-[40px] whitespace-nowrap ${filter===k?'!bg-amber !text-black !border-amber':''}">${n}</button>`).join('');
  const q=query.toLowerCase();
  let rows=accounts.filter(a=>(filter==='all'||(filter==='mat'?matured(a):a.status===filter))&&(!q||[a.name,a.email,a.buyer].some(v=>(v||'').toLowerCase().includes(q))));
  const rank={dead:0,unchecked:1,live:2};
  rows.sort((a,b)=>rank[a.status]-rank[b.status]||(a.name||'').localeCompare(b.name||''));
  shown=rows;
  $('#list').innerHTML=rows.length?rows.map(card).join(''):`<div class="text-center text-slate-400 py-16">${accounts.length?'No accounts match this view.':'No accounts yet.<br>Tap “+ Add Account” to store your first one.'}</div>`;
}
function badge(s){const m={live:['LIVE','bg-green-500/15 text-green-400 border-green-500/40'],dead:['DEAD / RESTRICTED','bg-red-500/15 text-red-400 border-red-500/40'],unchecked:['UNCHECKED','bg-slate-500/15 text-slate-300 border-slate-500/40']}[s]||[];return `<span class="text-xs font-bold px-2 py-1 rounded-lg border ${m[1]}">${m[0]}</span>`}
function card(a){
  const d=age(a.created),dead=a.status==='dead';
  return `<article data-id="${a.id}" class="bg-panel rounded-2xl p-4 border ${dead?'border-red-500/60':'border-line'}">
  <div class="flex items-start justify-between gap-2">
    <div class="min-w-0"><h2 class="text-lg font-semibold truncate">${esc(a.name)||'Unnamed'}</h2>
    <div class="flex flex-wrap gap-2 mt-1 items-center">${badge(a.status)}
      ${d!=null?`<span class="text-xs text-slate-300">${d} Day${d===1?'':'s'} Old</span>`:''}
      ${matured(a)?'<span class="text-xs font-bold px-2 py-1 rounded-lg bg-amber/15 text-amber border border-amber/40">Safe / Matured</span>':''}</div></div>
    <button class="btn" data-act="check" aria-label="Check profile">⟳</button>
  </div>
  <div class="mt-3 space-y-2 text-sm">
    <div class="flex items-center gap-2"><span class="truncate flex-1 text-slate-300">${esc(a.email)||'—'}</span>${a.email?'<button class="btn" data-act="copyEmail">Copy Email</button>':''}</div>
    <div class="flex items-center gap-2"><span class="truncate flex-1 text-slate-300">${esc(a.url)||'—'}</span>${a.url?'<button class="btn" data-act="open">Open</button><button class="btn" data-act="copyLink">Copy</button>':''}</div>
    <div class="flex items-center gap-2"><span class="text-slate-400">Connections</span>
      <input data-act="conn" type="number" inputmode="numeric" min="0" value="${a.conns??0}" class="in !w-28 !py-2 text-center font-semibold"></div>
    ${a.buyer?`<div class="text-slate-400">Buyer: <span class="text-slate-100">${esc(a.buyer)}</span></div>`:''}
    ${a.note?`<div class="text-xs text-amber">${esc(a.note)}</div>`:''}
  </div>
  <div class="flex items-center justify-between mt-3 pt-3 border-t border-line">
    <button data-act="toggle" class="flex items-center gap-2" aria-label="Toggle live or dead"><span class="sw ${a.status==='live'?'on':''}"></span><span class="text-sm">${a.status==='live'?'Live':'Dead'}</span></button>
    <div class="flex gap-2"><button class="btn" data-act="edit">Edit</button><button class="btn !text-red-400" data-act="del">Delete</button></div>
  </div></article>`;
}

// events
$('#list').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT')return;
  const id=b.closest('article').dataset.id,a=accounts.find(x=>x.id===id);if(!a)return;
  const act=b.dataset.act;
  if(act==='copyEmail')copy(a.email,'Email');
  else if(act==='copyLink')copy(a.url,'Link');
  else if(act==='open')window.open(a.url,'_blank','noopener');
  else if(act==='edit')form(a);
  else if(act==='toggle'){a.status=a.status==='live'?'dead':'live';a.note='';save();render()}
  else if(act==='check')checkOne(a,true);
  else if(act==='del'){if(confirm('Delete '+(a.name||'this account')+'?')){accounts=accounts.filter(x=>x.id!==id);save();render()}}
});
$('#list').addEventListener('change',e=>{
  if(e.target.dataset.act!=='conn')return;
  const a=accounts.find(x=>x.id===e.target.closest('article').dataset.id);
  a.conns=Math.max(0,parseInt(e.target.value)||0);save();toast('Connections saved');
});
$('#tabs').addEventListener('click',e=>{const t=e.target.closest('[data-tab]');if(!t)return;if(t.dataset.tab==='review'){startReview();return}filter=t.dataset.tab;render()});
$('#q').addEventListener('input',e=>{query=e.target.value.trim();render()});
$('#fab').onclick=()=>form();
$('#menuBtn').onclick=menu;
$('#checkAll').onclick=checkAll;

// sheets
function sheet(html){const m=$('#modal');m.innerHTML=`<div class="sheet bg-panel w-full rounded-t-3xl p-5 max-h-[92vh] overflow-y-auto" style="padding-bottom:calc(env(safe-area-inset-bottom) + 20px)">${html}</div>`;m.classList.remove('hidden');m.classList.add('flex')}
function closeSheet(){const m=$('#modal');m.classList.add('hidden');m.classList.remove('flex')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeSheet()});
function form(a){
  const v=a||{};
  sheet(`<h2 class="text-lg font-bold mb-4">${a?'Edit account':'Add account'}</h2>
  <div class="space-y-3">
   <input id="fName" class="in" placeholder="Account holder name" value="${esc(v.name)}">
   <input id="fEmail" class="in" type="email" placeholder="Login email" value="${esc(v.email)}">
   <input id="fUrl" class="in" type="url" placeholder="Profile URL (https://...)" value="${esc(v.url)}">
   <div class="grid grid-cols-2 gap-3">
     <input id="fConn" class="in" type="number" inputmode="numeric" min="0" placeholder="Connections" value="${v.conns??''}">
     <input id="fDate" class="in" type="date" value="${v.created||new Date().toISOString().slice(0,10)}">
   </div>
   <input id="fBuyer" class="in" placeholder="Assigned buyer / client (optional)" value="${esc(v.buyer)}">
   <select id="fStatus" class="in"><option value="unchecked">Unchecked</option><option value="live">Live</option><option value="dead">Dead / Restricted</option></select>
   <div class="flex gap-3 pt-2"><button class="btn flex-1" onclick="closeSheet()">Cancel</button><button id="fSave" class="btn flex-1 !bg-amber !text-black !border-amber">Save</button></div>
  </div>`);
  $('#fStatus').value=v.status||'unchecked';
  $('#fSave').onclick=()=>{
    const o={name:$('#fName').value.trim(),email:$('#fEmail').value.trim(),url:$('#fUrl').value.trim(),conns:parseInt($('#fConn').value)||0,created:$('#fDate').value,buyer:$('#fBuyer').value.trim(),status:$('#fStatus').value};
    if(!o.name&&!o.email&&!o.url){toast('Add a name, email or link');return}
    if(a)Object.assign(a,o);else accounts.unshift({id:uid(),note:'',...o});
    save();closeSheet();render();toast('Saved');
  };
}
function menu(){
  sheet(`<h2 class="text-lg font-bold mb-4">Backup & transfer</h2><div class="space-y-3">
   <button class="btn w-full" id="xJson">Export JSON backup</button>
   <button class="btn w-full" id="xCsv">Export CSV</button>
   <button class="btn w-full" id="iJson">Import JSON backup</button>
   <button class="btn w-full" id="cpAll">Copy links (current view) for Messenger</button>
   <button class="btn w-full" id="setBtn">Check settings</button>
   <button class="btn w-full" onclick="closeSheet()">Close</button></div>`);
  $('#xJson').onclick=()=>dl('vault-backup-'+today()+'.json',JSON.stringify(accounts,null,2),'application/json');
  $('#xCsv').onclick=()=>{
    const h=['name','email','url','connections','created','age_days','buyer','status'];
    const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
    dl('vault-'+today()+'.csv',[h.join(',')].concat(accounts.map(a=>[a.name,a.email,a.url,a.conns,a.created,age(a.created),a.buyer,a.status].map(q).join(','))).join('\n'),'text/csv');
  };
  $('#iJson').onclick=()=>$('#file').click();
  $('#setBtn').onclick=settingsSheet;
  $('#cpAll').onclick=()=>{const l=shown.map(a=>a.url).filter(Boolean);if(!l.length){toast('No links in this view');return}copy(l.join('\n'),l.length+' links');closeSheet()};
}
const today=()=>new Date().toISOString().slice(0,10);
function dl(n,t,type){const u=URL.createObjectURL(new Blob([t],{type}));const l=document.createElement('a');l.href=u;l.download=n;l.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('Exported')}
$('#file').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const d=JSON.parse(await f.text());if(!Array.isArray(d))throw 0;
    const replace=confirm('Import '+d.length+' accounts.\nOK = replace everything\nCancel = merge with current data');
    const clean=d.map(x=>({id:x.id||uid(),name:x.name||'',email:x.email||'',url:x.url||'',conns:+x.conns||0,created:x.created||'',buyer:x.buyer||'',status:['live','dead'].includes(x.status)?x.status:'unchecked',note:x.note||''}));
    if(replace)accounts=clean;else{const ids=new Set(accounts.map(a=>a.id));accounts=accounts.concat(clean.filter(c=>!ids.has(c.id)))}
    save();render();closeSheet();toast('Backup imported');
  }catch(err){toast('Invalid backup file')}
  e.target.value='';
});

// checker
const SK='accountVault.settings',DEF={delay:5,jitter:2,retries:2,timeout:15,blocked:'keep',method:'preview',token:''},lastTitle='';
let S={...DEF};try{S={...DEF,...JSON.parse(localStorage.getItem(SK)||'{}')}}catch(e){}
const isNative=()=>!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
async function fetchT(url,ms,o){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{return await fetch(url,{...(o||{}),signal:c.signal})}finally{clearTimeout(t)}}
async function getPage(url){
  const ms=S.timeout*1000;
  if(S.method==='microlink'){
    const r=await fetchT('https://api.microlink.io/?url='+encodeURIComponent(url),ms);
    return{code:r.status,body:await r.text()};
  }
  if(S.method==='facebook'){
    if(!S.token)throw new Error('Add Facebook token in Check settings');
    const r=await fetchT('https://graph.facebook.com/?id='+encodeURIComponent(url)+'&scrape=true&access_token='+encodeURIComponent(S.token),ms,{method:'POST'});
    return{code:r.status,body:await r.text()};
  }
  const H=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.CapacitorHttp;
  if(isNative()&&H){const r=await H.get({url,connectTimeout:ms,readTimeout:ms,headers:{'User-Agent':S.method==='browser'?'Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 Chrome/124 Mobile Safari/537.36':'facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)','Accept-Language':'en-US,en;q=0.9'}});return{code:r.status,body:typeof r.data==='string'?r.data:''}}
  const tries=[async()=>{const j=await (await fetchT('https://api.allorigins.win/get?url='+encodeURIComponent(url),ms)).json();return{code:(j.status&&j.status.http_code)||0,body:j.contents||''}},
               async()=>{const r=await fetchT('https://corsproxy.io/?'+encodeURIComponent(url),ms);return{code:r.status,body:await r.text()}}];
  let last;for(const t of tries){try{return await t()}catch(e){last=e}}throw last||new Error('proxy');
}
function classify(code,body){
  const t=(body||'').toLowerCase();
  if(S.method==='microlink'){
    let j={};try{j=JSON.parse(body)}catch(e){}
    if(code===429)return'blocked';
    if(j.statusCode===404||j.statusCode===410||(j.data&&(j.data.statusCode===404||j.data.statusCode===410)))return'dead';
    if(j.status==='success'){const ti=String((j.data&&j.data.title)||'').trim();
      if(ti&&!/^(linkedin|sign up|log ?in)|page not found/i.test(ti)){lastTitle=ti;return'live'}
      return ti?'dead':'blocked'}
    return /404|not found|410/i.test((j.message||'')+(j.code||''))?'dead':'error';
  }
  if(S.method==='facebook'){
    let j={};try{j=JSON.parse(body)}catch(e){}
    if(j.error){const c=j.error.code,m=j.error.message||'';
      if(c===190||c===102)throw new Error('Facebook token invalid');
      if([4,17,32,613,368].includes(c))return'blocked';
      return /scrap|resolve|404|not found|could not|status code|unsupported/i.test(m)?'dead':'error'}
    const ti=String(j.title||(j.og_object&&j.og_object.title)||'').trim();
    if(ti&&!/^(linkedin|sign up|log ?in)|page not found/i.test(ti)){lastTitle=ti;return'live'}
    return ti?'dead':'blocked';
  }
  if(code===404||code===410)return'dead';
  if(S.method!=='browser'&&isNative()&&code===200){
    const m=body.match(/<meta[^>]+property=["']og:title["'][^>]*content=["']([^"']*)/i)||body.match(/content=["']([^"']*)["'][^>]*property=["']og:title["']/i);
    const ti=m&&m[1].trim();
    if(ti&&!/^(linkedin|sign up|log ?in)|page not found/i.test(ti)){lastTitle=ti;return'live'}
    return ti?'dead':'blocked';
  }
  if(code===404||code===410||/page not found|this page doesn.t exist|profile is not available|has been restricted/.test(t))return'dead';
  if(code===999||code===429||/authwall|sign in to view|captcha|challenge/.test(t))return'blocked';
  if(code===200)return'live';
  return'error';
}
// returns 'live' | 'dead' | 'blocked' | 'error'
let runId=0,lastErr='';
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rj)=>setTimeout(()=>rj(new Error('timeout')),ms))]);
async function checkOne(a,single,my){
  if(!a.url){if(single)toast('No profile URL');return'error'}
  const el=document.querySelector(`[data-id="${a.id}"] [data-act=check]`);if(el)el.textContent='…';
  let res='error',code=0;lastTitle='';lastErr='';
  for(let i=0;i<=S.retries;i++){
    try{
      if(!navigator.onLine)throw new Error('offline');
      const r=await withTimeout(getPage(a.url),S.timeout*1000+2000);code=r.code;res=classify(r.code,r.body);
      if(res==='live'||res==='dead')break;
      if(res==='blocked'&&code!==429)break;
    }catch(e){res='error';lastErr=String((e&&e.message)||e)}
    if(!single&&my!==runId)break;
    if(i<S.retries)await sleep(Math.pow(2,i)*3000+(code===429?10000:0));
  }
  if(!single&&my!==runId){render();return'error'}
  if(res==='live'){a.status='live';a.note=lastTitle?'Preview: '+lastTitle:''}
  else if(res==='dead'){a.status='dead';a.note=`HTTP ${code} — wrong? use the Live/Dead switch`}
  else if(res==='blocked'){if(S.blocked==='dead')a.status='dead';a.note=`Blocked by site (HTTP ${code}) — set status manually`}
  else a.note='Check failed: '+(lastErr||'no response')+' — try again';
  a.lastChecked=Date.now();save();render();
  if(single)toast({live:'Live ✓',dead:'Dead ✕',blocked:'Blocked — set manually',error:'Check failed — try again'}[res]);
  return res;
}
function stopUI(){$('#checkAll').textContent='⟳ Check All';$('#prog').classList.add('hidden')}
async function checkAll(){
  if(checking){runId++;checking=false;stopUI();toast('Stopped');return}
  const list=accounts.filter(a=>a.url);if(!list.length){toast('No profile links to check');return}
  const my=++runId;checking=true;$('#checkAll').textContent='■ Stop';$('#prog').classList.remove('hidden');
  const n={live:0,dead:0,blocked:0,error:0};let bad=0;
  for(let i=0;i<list.length&&my===runId;i++){
    while(!navigator.onLine&&my===runId){$('#prog').textContent='Offline — waiting for connection…';await sleep(2000)}
    if(my!==runId)break;
    $('#prog').textContent=`Checking ${i+1} of ${list.length}: ${list[i].name||list[i].url}`;
    const r=await checkOne(list[i],false,my);if(my!==runId)break;n[r]++;
    bad=(r==='blocked'||r==='error')?bad+1:0;
    if(bad>=5){toast('Stopped: 5 failures in a row. Wait a few minutes.');break}
    if(i<list.length-1){
      let w=Math.max(3,S.delay)+Math.random()*S.jitter;
      if(r==='blocked'||r==='error')w+=10;
      for(let t=Math.ceil(w);t>0&&my===runId;t--){$('#prog').textContent=`Checked ${i+1}/${list.length} · next in ${t}s`;await sleep(1000)}
    }
  }
  if(my===runId){checking=false;stopUI();toast(`Done — Live ${n.live}, Dead ${n.dead}, Blocked ${n.blocked}, Failed ${n.error}`)}
}
function startReview(){
  const q=shown.filter(a=>a.url).map(a=>a.id);
  if(!q.length){toast('No links in this view');return}
  let i=0;const c={live:0,dead:0};
  const step=()=>{
    if(i>=q.length){closeSheet();render();toast(`Review done — Live ${c.live}, Dead ${c.dead}`);return}
    const a=accounts.find(x=>x.id===q[i]);if(!a){i++;return step()}
    sheet(`<div class="text-sm text-slate-400 mb-1">Account ${i+1} of ${q.length}</div>
    <h2 class="text-xl font-bold truncate">${esc(a.name)||'Unnamed'}</h2>
    <div class="text-xs text-slate-400 break-all mb-4">${esc(a.url)}</div>
    <button id="rOpen" class="btn w-full !min-h-[56px] !bg-amber !text-black !border-amber mb-3">1. Open profile</button>
    <div class="text-sm text-slate-300 mb-2">2. Come back and tap what you saw (page opens = Live, not found = Dead):</div>
    <div class="grid grid-cols-2 gap-3 mb-3"><button id="rLive" class="btn !min-h-[64px] !bg-green-600 !border-green-600 !text-white text-lg">✓ Live</button><button id="rDead" class="btn !min-h-[64px] !bg-red-600 !border-red-600 !text-white text-lg">✕ Dead</button></div>
    <div class="flex gap-3"><button id="rSkip" class="btn flex-1">Skip</button><button id="rStop" class="btn flex-1">Finish</button></div>`);
    $('#rOpen').onclick=()=>window.open(a.url,'_blank','noopener');
    const mark=st=>{a.status=st;a.note='';a.lastChecked=Date.now();save();render();c[st]++;i++;step()};
    $('#rLive').onclick=()=>mark('live');$('#rDead').onclick=()=>mark('dead');
    $('#rSkip').onclick=()=>{i++;step()};$('#rStop').onclick=()=>{closeSheet();render()};
  };
  step();
}
function settingsSheet(){
  sheet(`<h2 class="text-lg font-bold mb-1">Check settings</h2><p class="text-xs text-slate-400 mb-4">Slower is safer. Minimum delay is 3 seconds.</p><div class="space-y-3 text-sm">
   <label class="block">Check method<select id="sM" class="in mt-1"><option value="microlink">Preview service — no setup (50 checks/day)</option><option value="facebook">Facebook preview service (best, needs token)</option><option value="preview">Link-preview (like Messenger) — APK only</option><option value="browser">Browser-style</option></select></label>
   <label class="block">Facebook token (APPID|APPSECRET)<input id="sK" class="in mt-1" placeholder="123456|abcdef..." value="${esc(S.token)}"></label>
   <label class="block">Delay between checks (seconds)<input id="sD" class="in mt-1" type="number" min="3" value="${S.delay}"></label>
   <label class="block">Random extra delay (0–N seconds)<input id="sJ" class="in mt-1" type="number" min="0" value="${S.jitter}"></label>
   <label class="block">Retries on failure<input id="sR" class="in mt-1" type="number" min="0" max="5" value="${S.retries}"></label>
   <label class="block">Timeout per request (seconds)<input id="sT" class="in mt-1" type="number" min="5" value="${S.timeout}"></label>
   <label class="block">If site blocks the check (999 / login wall)<select id="sB" class="in mt-1"><option value="keep">Keep current status (recommended)</option><option value="dead">Mark as DEAD</option></select></label>
   <div class="flex gap-3 pt-2"><button class="btn flex-1" onclick="closeSheet()">Cancel</button><button id="sS" class="btn flex-1 !bg-amber !text-black !border-amber">Save</button></div></div>`);
  $('#sB').value=S.blocked;$('#sM').value=S.method;
  $('#sS').onclick=()=>{S={delay:Math.max(3,+$('#sD').value||5),jitter:Math.max(0,+$('#sJ').value||0),retries:Math.min(5,Math.max(0,+$('#sR').value||0)),timeout:Math.max(5,+$('#sT').value||15),blocked:$('#sB').value,method:$('#sM').value,token:$('#sK').value.trim()};
    try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){}closeSheet();toast('Settings saved')};
}

load();render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
